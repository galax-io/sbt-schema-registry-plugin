# suppress inspection "UnusedProperty"
#
# Stays on the sbt 1 line on purpose (specs/015-sbt-2-upgrade, fallback of T-003). Building the plugin
# as a projectMatrix from an sbt 2.0.9 launcher could not keep the published artifacts unchanged: the
# sbt upgrade parity gate found neither axis under the gate's `+publishLocal +publishM2`, and MiMa
# reported 413 binary differences on _sbt2_3 against the pluginCrossBuild build.
#
# So pluginCrossBuild builds _2.12_1.0 on this launcher exactly as before, and only the Scala 3 sub-build
# that produces _sbt2_3 runs on sbt 2.0.9, by overriding this pin for that one cross-target:
#   sbt -Dsbt.version=2.0.9 "++3.8.4" <tasks>
# Its classes and POM match what this launcher produces for the same axis (scala3-library stays
# provided, see build.sbt).
sbt.version=1.13.0
