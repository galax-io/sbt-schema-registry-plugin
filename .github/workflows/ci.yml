name: Continuous Integration

on:
  pull_request:
    branches: ['**']
  push:
    branches: ['main', 'release/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SBT_OPTS: -Dsbt.color=true -Dsbt.log.noformat=false -Dsbt.supershell=false
  JAVA_OPTS: -Xms2G -Xmx2G -Xss4M -XX:+UseG1GC
  FORCE_COLOR: "1"
  TERM: xterm-256color

jobs:
  format:
    name: Check Formatting
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/sbt-setup
      - run: sbt scalafmtCheckAll scalafmtSbtCheck

  test:
    name: Test (Scala ${{ matrix.scala }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # One leg per axis, each on the launcher that builds it (project/build.properties):
        #   2.12.21 -> sbt 1.x artifact (_2.12_1.0), on the pinned sbt 1.13.0 launcher
        #   3.8.4   -> sbt 2.x artifact (_sbt2_3), on an sbt 2.0.9 launcher
        include:
          - scala: '2.12.21'
            launcher: ''
          - scala: '3.8.4'
            launcher: '-Dsbt.version=2.0.9'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/sbt-setup
      - name: Compile
        run: sbt ${{ matrix.launcher }} "++${{ matrix.scala }}" compile
      - name: Binary compatibility (MiMa)
        # Blocking on both axes, each against its own 1.9.0 artifact (build.sbt); the Scala 3 leg is
        # checked by the sbt 2 build of sbt-mima-plugin that the sbt 2.0.9 launcher loads.
        run: sbt ${{ matrix.launcher }} "++${{ matrix.scala }}" mimaReportBinaryIssues
      - name: Test
        run: sbt ${{ matrix.launcher }} "++${{ matrix.scala }}" coverage test coverageReport coverageOff
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        with:
          fail_ci_if_error: false

  it-test:
    name: Integration Test (Scala ${{ matrix.scala }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # 2.12.21 -> sbt 1.x axis on the pinned launcher; 3.8.4 -> sbt 2.x axis on sbt 2.0.9
        include:
          - scala: '2.12.21'
            launcher: ''
          - scala: '3.8.4'
            launcher: '-Dsbt.version=2.0.9'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/sbt-setup
      - name: Integration Test
        run: sbt ${{ matrix.launcher }} "++${{ matrix.scala }}" it/test

  scripted:
    name: Scripted (sbt ${{ matrix.sbt }})
    runs-on: ubuntu-24.04
    # Each fixture boots its own Kafka + Schema Registry containers (~45s each) across ~27 fixtures;
    # the sbt-2 legs also compile fixture metabuilds with Scala 3. 20 min is too tight once the
    # suite runs per-axis. (Follow-up: shard fixtures across parallel jobs to cut wall-clock.)
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Each axis runs on its declared minimum (pluginCrossBuild / sbtVersion in build.sbt, which is
        # also scripted's default) and on the newest release of its sbt line. `launcher` is the sbt
        # that builds the axis (project/build.properties); `sbt` is the version scripted runs.
        include:
          - scala: '2.12.21'
            launcher: ''
            sbt: '1.12.12'
          - scala: '2.12.21'
            launcher: ''
            sbt: '1.13.0'
          - scala: '3.8.4'
            launcher: '-Dsbt.version=2.0.9'
            sbt: '2.0.0'
          - scala: '3.8.4'
            launcher: '-Dsbt.version=2.0.9'
            sbt: '2.0.9'
    env:
      # Testcontainers boots from sbt's meta-build classloader, where strategy
      # ServiceLoader discovery finds no socket strategy. Point it at the daemon
      # explicitly via the env strategy (which needs no ServiceLoader).
      DOCKER_HOST: unix:///var/run/docker.sock
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/sbt-setup
      - name: Scripted tests
        # Some tests assert expected failures (-> prefix in sbt scripted).
        # [error] lines in the log from download-failure, hook-compile, and
        # hook-source-generators are intentional — they prove the plugin
        # correctly fails the build when the registry is unreachable.
        #
        # sbt-2 legs: per-fixture gating (the skip list in README.md, "Scripted tests"). A fixture is
        # skipped on sbt 2.x if either
        #   (a) it contains an `sbt2-skip` marker file (an sbt-2-incompatible build pattern,
        #       e.g. overriding `Compile / compile` which needs Def.uncached on sbt 2), or
        #   (b) its project/plugins.sbt adds an external sbt plugin other than this one
        #       (e.g. download-success -> sbt-avrohugger 2.17.0) with no sbt-2 build yet.
        # All other fixtures run on both axes.
        run: |
          set -euo pipefail
          SET_SBT="set scriptedSbt := \"${{ matrix.sbt }}\""
          case "${{ matrix.sbt }}" in
            1.*)
              sbt ${{ matrix.launcher }} "++${{ matrix.scala }}" "$SET_SBT" scripted
              ;;
            *)
              FIXTURES=$(for d in src/sbt-test/schema-registry/*/; do
                n=$(basename "$d")
                if [ -f "${d}sbt2-skip" ]; then
                  echo "skip sbt-2 scripted: $n (sbt2-skip marker)" >&2
                  continue
                fi
                pf="${d}project/plugins.sbt"
                ext=""
                if [ -f "$pf" ]; then
                  ext=$(grep -E 'addSbtPlugin' "$pf" | grep -v 'sbt-schema-registry-plugin' || true)
                fi
                if [ -n "$ext" ]; then
                  echo "skip sbt-2 scripted: $n (external sbt-1-only plugin)" >&2
                  continue
                fi
                printf 'schema-registry/%s ' "$n"
              done)
              if [ -z "$FIXTURES" ]; then
                echo "ERROR: all sbt-2 scripted fixtures were filtered out — gating misconfigured" >&2
                exit 1
              fi
              sbt ${{ matrix.launcher }} "++${{ matrix.scala }}" "$SET_SBT" "scripted $FIXTURES"
              ;;
          esac

  parity:
    name: sbt upgrade parity
    # Builds this PR's base with its own launcher and its head with the pinned one (project/build.properties):
    # _2.12_1.0 must be identical to the base build, and _sbt2_3 must show zero MiMa issues.
    if: github.event_name == 'pull_request'
    uses: galax-io/gatling-picatinny/.github/workflows/sbt-upgrade-parity.yml@4a4d8413b0a593927efc560198da3452fecee8cd
    with:
      mode: sbt-plugin
      artifact-suffixes: '_2.12_1.0,_sbt2_3'
