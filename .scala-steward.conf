updates.ignore = [
  # sbt 1.x plugins must compile under Scala 2.12
  { groupId = "org.scala-lang", artifactId = "scala-library" }
  # sbt 2.x requires Scala 3 migration — not a drop-in upgrade
  { groupId = "org.scala-sbt", artifactId = "sbt" }
  # build.sbt's `scala3` val must match whatever Scala 3 sbt 2.x itself embeds ("bump both
  # together"). 3.9.0 LTS ships with sbt 2.1.0, not the 2.0.x line this project pins — bumping
  # this alone breaks the CI matrix. Drop once the sbt 2.x pin above moves to 2.1.0.
  { groupId = "org.scala-lang", artifactId = "scala3-library" }
]

# Conventional Commits, matching cliff.toml's "^chore\(deps\)" Dependencies group.
commits.message = "chore(deps): update ${artifactName} from ${currentVersion} to ${nextVersion}"
